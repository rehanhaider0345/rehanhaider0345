<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" role="img" aria-label="Featured Projects">
<defs>
  <linearGradient id="t" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0.00" stop-color="#a78bfa"/><stop offset="0.33" stop-color="#22d3ee"/><stop offset="0.67" stop-color="#f472b6"/><stop offset="1.00" stop-color="#a78bfa"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="u" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<text x="450" y="42" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="url(#t)" filter="url(#g)"><tspan>🚀</tspan> Featured Projects</text>
<style>.u { transform-box: fill-box; transform-origin: center; animation: grow 1.2s ease-out backwards } @keyframes grow { from { transform: scaleX(0) } }</style>
<rect class="u" x="270" y="60" width="360" height="3" rx="1.5" fill="url(#u)"/>
<circle cx="270" cy="61.5" r="3.5" opacity="0" fill="#fff" filter="url(#g)">
  <animate attributeName="cx" values="270;630;270" dur="4s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
</circle>
</svg>
