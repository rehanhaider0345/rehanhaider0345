<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" role="img" aria-label="I'm a Software Engineering student at FAST NUCES Peshawar who builds full-stack web apps and AI-powered systems. Open to internships and collaborations.">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size: 19.5px; fill: #c9d1d9; }
  @media (prefers-color-scheme: light) { text { fill: #424a53; } }
  .l { animation: up .8s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes up { from { opacity:0; transform: translateY(12px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs><linearGradient id="ship" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0.00" stop-color="#22c55e"/><stop offset="0.33" stop-color="#06b6d4"/><stop offset="0.67" stop-color="#8b5cf6"/><stop offset="1.00" stop-color="#22c55e"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="3s" repeatCount="indefinite"/></linearGradient></defs>
<text class="l" style="animation-delay:0.15s" x="450" y="34" text-anchor="middle">I&#x27;m a <tspan fill="#8b5cf6" font-weight="700">Software Engineering</tspan> student at <tspan fill="#06b6d4" font-weight="700">FAST NUCES Peshawar</tspan> (2023 – 2027) who loves</text><text class="l" style="animation-delay:0.33s" x="450" y="66" text-anchor="middle">turning complex problems into <tspan fill="#ec4899" font-weight="700">practical, production-ready software</tspan>.</text><text class="l" style="animation-delay:0.51s" x="450" y="116" text-anchor="middle">I build <tspan fill="#8b5cf6" font-weight="700">full-stack web apps</tspan> and <tspan fill="#06b6d4" font-weight="700">AI-powered systems</tspan>, from <tspan fill="#ec4899" font-weight="700">RAG chatbots</tspan> grounded</text><text class="l" style="animation-delay:0.69s" x="450" y="148" text-anchor="middle">in real documents to cloud-backed React apps and <tspan fill="#f59e0b" font-weight="700">interactive data dashboards</tspan>.</text><text class="l" style="animation-delay:0.87s" x="450" y="198" text-anchor="middle">Right now I&#x27;m exploring <tspan fill="#f59e0b" font-weight="700">LLM integration</tspan>, <tspan fill="#8b5cf6" font-weight="700">prompt engineering</tspan> and the space</text><text class="l" style="animation-delay:1.05s" x="450" y="230" text-anchor="middle">where <tspan fill="#ec4899" font-weight="700">AI meets cybersecurity</tspan>.</text><text class="l" style="animation-delay:1.23s" x="450" y="280" text-anchor="middle"><tspan fill="#22c55e" font-weight="700">●</tspan> Open to internships &amp; collaborations, because I don&#x27;t just learn, <tspan fill="url(#ship)" font-weight="800">I ship.</tspan></text>
</svg>
