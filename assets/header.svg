<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Syed Rehan Haider - Software Engineer">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  .f { animation: up .9s cubic-bezier(.2,.8,.2,1) backwards; }
  .d1 { animation-delay:.1s } .d2 { animation-delay:.4s } .d3 { animation-delay:.8s } .d4 { animation-delay:1.2s }
  @keyframes up { from { opacity:0; transform: translateY(18px) } to { opacity:1; transform:none } }
  .blink { animation: b 1s steps(1) infinite }
  @keyframes b { 50% { opacity:0 } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07071a"/><stop offset="1" stop-color="#150a2e"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0.00" stop-color="#22d3ee"/><stop offset="0.33" stop-color="#a78bfa"/><stop offset="0.67" stop-color="#f472b6"/><stop offset="1.00" stop-color="#22d3ee"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat"><stop offset="0.00" stop-color="#a78bfa"/><stop offset="0.33" stop-color="#22d3ee"/><stop offset="0.67" stop-color="#f472b6"/><stop offset="1.00" stop-color="#a78bfa"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="4s" repeatCount="indefinite"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".09"/></pattern>
  <clipPath id="clip"><rect width="1200" height="380" rx="26"/></clipPath>
</defs>
