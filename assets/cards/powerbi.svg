<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-label="Sales Dashboard">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  .in { animation: up .8s ease-out .15s backwards }
  @keyframes up { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#f472b6" stop-opacity=".15"/><stop offset="1" stop-color="#fbbf24"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="5s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1028"/><stop offset="1" stop-color="#070816"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <clipPath id="clip"><rect x="2" y="2" width="436" height="246" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="440" height="250" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="70" fill="#f472b6" opacity=".28" filter="url(#blur)">
    <animate attributeName="opacity" values=".15;.38;.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="30" r="55" fill="#fbbf24" opacity=".2" filter="url(#blur)"/>
  <rect x="-200" y="0" width="140" height="250" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" values="-200;640;640" keyTimes="0;.45;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <g class="in">
    <text x="24" y="58" font-size="32">📊</text>
    <text x="72" y="50" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#f8fafc">Sales Dashboard</text>
    <text x="72" y="71" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="12" fill="#fbbf24">// data analytics · Power BI</text>
    <rect x="357.6" y="22" width="64" height="24" rx="12" fill="#fbbf24" fill-opacity=".14"/><circle cx="371.6" cy="34" r="4" fill="#fbbf24"><animate attributeName="r" values="3;5.5;3" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="414" y="38.5" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="700" fill="#fbbf24">DATA</text>
    <text x="26" y="108" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#cbd5e1">Cleaned and modelled e-commerce sales data, then</text><text x="26" y="129" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#cbd5e1">built an interactive dashboard for profit,</text><text x="26" y="150" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#cbd5e1">segments and regions with drill-downs and KPIs.</text>
    <rect x="26" y="202" width="81" height="24" rx="12" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".55"/><text x="67" y="219" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="12" fill="#fbbf24">Power BI</text><rect x="115.2" y="202" width="66" height="24" rx="12" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".55"/><text x="148" y="219" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="12" fill="#fbbf24">Pandas</text><rect x="189.60000000000002" y="202" width="103" height="24" rx="12" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".55"/><text x="241" y="219" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="12" fill="#fbbf24">Power Query</text>
  </g>
</g>
<rect x="1.5" y="1.5" width="437" height="247" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
